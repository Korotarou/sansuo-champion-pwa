name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct runtime assets
        shell: bash
        run: |
          set -euo pipefail
          cat .gzparts/app.js.gz.b64.* | base64 -d | gunzip > app.js
          cat .gzparts/problem_engine.js.gz.b64.* | base64 -d | gunzip > problem_engine.js
          cat .gzparts/problems.js.gz.b64.* | base64 -d | gunzip > problems.js
          test -s app.js
          test -s problem_engine.js
          test -s problems.js
          node --check app.js
          node --check problem_engine.js
          node --check problems.js
          node --check sapix-analyzer.js
          node --check parent-dashboard.js
          node --check longitudinal-engine.js
          node --check recovery-engine.js
          grep -q 'recovery-engine.js' index.html
          grep -q 'longitudinal-engine.js' index.html
          grep -q 'sapix-analyzer.js' index.html
          grep -q 'parent-dashboard.js' index.html

      - name: Synthetic SAPIX parser test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          global.window = {};
          eval(fs.readFileSync('sapix-analyzer.js','utf8'));
          let q = '';
          for (let i=1;i<=30;i++) {
            const section=Math.ceil(i/5), sub=((i-1)%5)+1;
            q += section+'-('+sub+') 5 '+(i%4===0?'×':'○')+' '+(95-i*2.3).toFixed(1)+' ';
          }
          const text = [
            '夏期講習マンスリー確認テスト＜４年生＞',
            '2026年8月27日 実施',
            '4科目計 306 / 500 52.7',
            '算 数 95 / 150 55.6',
            '国 語 88 / 150 47.6',
            '理 科 65 / 100 52.5',
            '社 会 58 / 100 51.7',
            '分野 得点/配点 平均点',
            '1 計算問題 10 / 20 14.1',
            '2 小問集合 25 / 45 26.0',
            '3 平面図形 20 / 25 14.8',
            '4 立体図形 25 / 25 9.2',
            '5 規則性 5 / 20 9.0',
            '6 場合の数 10 / 15 2.7',
            '---PAGE--- 正答率一覧 '+q
          ].join(' ');
          const a = window.SapixAnalyzer.analyzeText(text,'fixture');
          if (a.summary.math.dev !== 55.6) throw new Error('math summary parse failed');
          if (a.parseQuality.sectionsTotal !== 150) throw new Error('section parse failed');
          if (a.parseQuality.questionsTotal !== 150 || a.parseQuality.questionCount !== 30) throw new Error('question parse failed');
          console.log('SAPIX parser fixture PASS');
          NODE

      - name: Longitudinal weakness engine test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          global.window={};
          eval(fs.readFileSync('longitudinal-engine.js','utf8'));
          const mk=(date,cause,domain,dev,must,recover)=>({
            date,
            causes:cause?{'1-(1)':cause}:{},
            metrics:{mustCount:must,mustPoints:must*5,recoverablePoints:recover},
            summary:{math:{dev}},
            mathSections:[
              {name:domain,scoreRate:50,avgRate:67},
              {name:'立体図形',scoreRate:80,avgRate:65}
            ]
          });
          const data=[
            mk('2026-09-01','F','平面図形',58,1,10),
            mk('2026-08-20','F','平面図形',55,2,20),
            mk('2026-08-01','C','場合の数',54,1,15),
            mk('2026-07-15','F','平面図形',52,1,20),
            mk('2026-06-20','E','計算',50,0,5)
          ];
          const r=window.LongitudinalAnalyzer.analyze(data,5);
          if(r.window!==5) throw new Error('window failed');
          if(!r.causes.find(x=>x.code==='F'&&x.tests===3)) throw new Error('cause recurrence failed');
          if(!r.domains.find(x=>x.domain==='平面図形'&&x.tests===3)) throw new Error('domain recurrence failed');
          if(r.priorities.length<2) throw new Error('priority selection failed');
          if(!r.recommendationKeywords.includes('平面図形')) throw new Error('recommendation keywords failed');
          console.log('Longitudinal engine PASS');
          NODE

      - name: Recovery graduation engine test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          global.window={LongitudinalAnalyzer:{
            weakDomainsForTest:()=>[],
            analyze:()=>({domains:[]})
          }};
          eval(fs.readFileSync('recovery-engine.js','utf8'));
          const a={date:'2026-09-01',name:'SAPIX',causes:{'1-(1)':'F'},mathQuestions:[
            {id:'1-(1)',points:5,rate:80,correct:false,bucket:'must'}
          ],summary:{total4:{score:350,max:500}},metrics:{recoverablePoints:15}};
          let records=window.RecoveryEngine.sync([a],[]);
          if(records.length!==1||records[0].status!=='unresolved') throw new Error('sync failed');
          records=window.RecoveryEngine.addAttempt(records,records[0].id,'pass','2026-09-02');
          if(records[0].status!=='strengthening') throw new Error('stage1 failed');
          records=window.RecoveryEngine.addAttempt(records,records[0].id,'fail','2026-09-04');
          if(records[0].status!=='unresolved') throw new Error('fail reset failed');
          records=window.RecoveryEngine.addAttempt(records,records[0].id,'pass','2026-09-05');
          records=window.RecoveryEngine.addAttempt(records,records[0].id,'pass','2026-09-08');
          if(records[0].status!=='graduated') throw new Error('graduation failed');
          const alpha=window.RecoveryEngine.alphaStatus([a],{label:'SAPIX α1入室',cutoffScore:360,currentClass:'H'});
          if(alpha.gap!==10||!alpha.recoverableCoversGap) throw new Error('alpha gap failed');
          console.log('Recovery/alpha1 engine PASS');
          NODE

      - name: Verify PWA structure and privacy
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f curriculum.js
          test -f all_problems.js
          test -f sw.js
          test -f manifest.webmanifest
          test -f robots.txt
          test -f assets/icon.svg
          test -f .nojekyll
          if grep -R --exclude-dir=.git --exclude-dir=.github --exclude-dir=.parts --exclude-dir=.gzparts -n "隼" .; then
            echo "Public runtime contains a personal name" >&2
            exit 1
          fi

      - name: Remove transfer-only sources
        run: rm -rf .parts .gzparts

      - name: Setup and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
