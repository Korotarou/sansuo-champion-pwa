name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct runtime assets
        shell: bash
        run: |
          set -euo pipefail
          cat .gzparts/app.js.gz.b64.* | base64 -d | gunzip > app.js
          cat .gzparts/problem_engine.js.gz.b64.* | base64 -d | gunzip > problem_engine.js
          cat .gzparts/problems.js.gz.b64.* | base64 -d | gunzip > problems.js
          test -s app.js
          test -s problem_engine.js
          test -s problems.js
          node --check app.js
          node --check problem_engine.js
          node --check problems.js
          node --check sapix-analyzer.js
          node --check parent-dashboard.js
          node --check longitudinal-engine.js
          node --check recovery-engine.js
          node --check alpha1-planner.js
          grep -q 'alpha1-planner.js' index.html
          grep -q 'recovery-engine.js' index.html
          grep -q 'longitudinal-engine.js' index.html
          grep -q 'sapix-analyzer.js' index.html
          grep -q 'parent-dashboard.js' index.html

      - name: Synthetic SAPIX parser test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          global.window = {};
          eval(fs.readFileSync('sapix-analyzer.js','utf8'));
          let q = '';
          for (let i=1;i<=30;i++) {
            const section=Math.ceil(i/5), sub=((i-1)%5)+1;
            q += section+'-('+sub+') 5 '+(i%4===0?'×':'○')+' '+(95-i*2.3).toFixed(1)+' ';
          }
          const text = [
            '夏期講習マンスリー確認テスト＜４年生＞',
            '2026年8月27日 実施',
            '4科目計 306 / 500 52.7',
            '算 数 95 / 150 55.6',
            '国 語 88 / 150 47.6',
            '理 科 65 / 100 52.5',
            '社 会 58 / 100 51.7',
            '分野 得点/配点 平均点',
            '1 計算問題 10 / 20 14.1',
            '2 小問集合 25 / 45 26.0',
            '3 平面図形 20 / 25 14.8',
            '4 立体図形 25 / 25 9.2',
            '5 規則性 5 / 20 9.0',
            '6 場合の数 10 / 15 2.7',
            '---PAGE--- 正答率一覧 '+q
          ].join(' ');
          const a = window.SapixAnalyzer.analyzeText(text,'fixture');
          if (a.summary.math.dev !== 55.6) throw new Error('math summary parse failed');
          if (a.parseQuality.sectionsTotal !== 150) throw new Error('section parse failed');
          if (a.parseQuality.questionsTotal !== 150 || a.parseQuality.questionCount !== 30) throw new Error('question parse failed');
          console.log('SAPIX parser fixture PASS');
          NODE

      - name: Longitudinal weakness engine test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          global.window={};
          eval(fs.readFileSync('longitudinal-engine.js','utf8'));
          const mk=(date,cause,domain,dev,must,recover)=>({
            date,
            causes:cause?{'1-(1)':cause}:{},
            metrics:{mustCount:must,mustPoints:must*5,recoverablePoints:recover},
            summary:{math:{dev}},
            mathSections:[
              {name:domain,scoreRate:50,avgRate:67},
              {name:'立体図形',scoreRate:80,avgRate:65}
            ]
          });
          const data=[
            mk('2026-09-01','F','平面図形',58,1,10),
            mk('2026-08-20','F','平面図形',55,2,20),
            mk('2026-08-01','C','場合の数',54,1,15),
            mk('2026-07-15','F','平面図形',52,1,20),
            mk('2026-06-20','E','計算',50,0,5)
          ];
          const r=window.LongitudinalAnalyzer.analyze(data,5);
          if(r.window!==5) throw new Error('window failed');
          if(!r.causes.find(x=>x.code==='F'&&x.tests===3)) throw new Error('cause recurrence failed');
          if(!r.domains.find(x=>x.domain==='平面図形'&&x.tests===3)) throw new Error('domain recurrence failed');
          if(r.priorities.length<2) throw new Error('priority selection failed');
          if(!r.recommendationKeywords.includes('平面図形')) throw new Error('recommendation keywords failed');
          console.log('Longitudinal engine PASS');
          NODE

      - name: Recovery graduation engine test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          global.window={LongitudinalAnalyzer:{
            weakDomainsForTest:()=>[],
            analyze:()=>({domains:[]})
          }};
          eval(fs.readFileSync('recovery-engine.js','utf8'));
          const a={date:'2026-09-01',name:'SAPIX',causes:{'1-(1)':'F'},mathQuestions:[
            {id:'1-(1)',points:5,rate:80,correct:false,bucket:'must'}
          ],summary:{total4:{score:350,max:500}},metrics:{recoverablePoints:15}};
          let records=window.RecoveryEngine.sync([a],[]);
          if(records.length!==1||records[0].status!=='unresolved') throw new Error('sync failed');
          records=window.RecoveryEngine.addAttempt(records,records[0].id,'pass','2026-09-02');
          if(records[0].status!=='strengthening') throw new Error('stage1 failed');
          records=window.RecoveryEngine.addAttempt(records,records[0].id,'fail','2026-09-04');
          if(records[0].status!=='unresolved') throw new Error('fail reset failed');
          records=window.RecoveryEngine.addAttempt(records,records[0].id,'pass','2026-09-05');
          records=window.RecoveryEngine.addAttempt(records,records[0].id,'pass','2026-09-08');
          if(records[0].status!=='graduated') throw new Error('graduation failed');
          const alpha=window.RecoveryEngine.alphaStatus([a],{label:'SAPIX α1入室',cutoffScore:360,currentClass:'H'});
          if(alpha.gap!==10||!alpha.recoverableCoversGap) throw new Error('alpha gap failed');
          console.log('Recovery/alpha1 engine PASS');
          NODE

      - name: Alpha1 score planner test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          global.window={};
          eval(fs.readFileSync('alpha1-planner.js','utf8'));
          const latest={
            date:'2026-09-01',name:'SAPIX',
            summary:{
              total4:{score:350,max:500,dev:58},
              math:{score:95,max:150,dev:60},
              jp:{score:90,max:150,dev:56},
              science:{score:85,max:100,dev:61},
              social:{score:80,max:100,dev:55}
            },
            metrics:{mustCount:1,mustPoints:5,targetCount:2,targetPoints:10,growthPoints:5}
          };
          const goal={cutoffs:{'2026-09-01|SAPIX':360},margin:5};
          const plan=window.Alpha1Planner.analyze([latest],goal,{due:2},{priorities:[]});
          if(plan.scenarioTarget!==365) throw new Error('scenario target failed');
          if(plan.gap!==15) throw new Error('gap failed');
          if(plan.routeStatus!=='within-50plus') throw new Error('route classification failed');
          if(plan.counterfactual50!==365) throw new Error('counterfactual failed');
          if(!plan.processTargets.find(x=>x.area==='算数')) throw new Error('process target failed');
          const unknown=window.Alpha1Planner.analyze([latest],{cutoffs:{}},{due:0},{priorities:[]});
          if(unknown.scenarioTarget!==null||unknown.gap!==null) throw new Error('unknown cutoff handling failed');
          console.log('Alpha1 planner PASS');
          NODE

      - name: Science PWA integrity test
        shell: bash
        run: |
          set -euo pipefail
          for f in science/questions-{1..8}.js science/sapix-import.js science/app-core.js science/app-quiz.js science/app-results.js science/app-boot.js; do
            node --check "$f"
          done
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const context={
            window:{},
            localStorage:{getItem:()=>null,setItem:()=>{}},
            document:{querySelector:()=>null,querySelectorAll:()=>[]}
          };
          vm.createContext(context);
          for(let i=1;i<=8;i++) vm.runInContext(fs.readFileSync('science/questions-'+i+'.js','utf8'),context);
          const qs=context.window.HAYABUSA_SCIENCE_QUESTIONS||[];
          if(qs.length!==100) throw new Error('science question count: '+qs.length);
          const ids=qs.map(q=>q.id);
          if(new Set(ids).size!==ids.length) throw new Error('duplicate science question id');
          for(const q of qs){
            if(!q.id||!q.domain||!q.level||!q.skill||!q.type||!q.prompt) throw new Error('missing field: '+(q.id||'unknown'));
            if(q.type==='choice'&&(!Array.isArray(q.choices)||q.answer<0||q.answer>=q.choices.length)) throw new Error('invalid choice answer: '+q.id);
          }
          vm.runInContext(fs.readFileSync('science/app-core.js','utf8'),context);
          const focus=vm.runInContext('weeklyFocus()',context);
          const weekly=vm.runInContext('weeklyPriorityQuestions(7)',context);
          const alpha=vm.runInContext('selectQuestions("alpha")',context);
          if(focus.length<3) throw new Error('weekly focus generation failed');
          if(weekly.length!==7) throw new Error('weekly set generation failed: '+weekly.length);
          if(alpha.length!==5) throw new Error('alpha set generation failed: '+alpha.length);
          vm.runInContext("state.sapixSections.push({date:'2099-01-01',topic:'水溶液',score:1,max:40,average:25})",context);
          const adaptive=vm.runInContext('weeklyFocus()',context);
          if(!adaptive.length || adaptive[0].topic!=='水溶液') throw new Error('SAPIX adaptive priority failed');
          const html=fs.readFileSync('science/index.html','utf8');
          const sw=fs.readFileSync('science/sw.js','utf8');
          for(const name of ['questions-7.js','questions-8.js','sapix-import.js','app-core.js','app-quiz.js','app-results.js','app-boot.js']){
            if(!html.includes(name)) throw new Error('science html missing '+name);
            if(!sw.includes('./'+name)) throw new Error('science cache missing '+name);
          }
          vm.runInContext(fs.readFileSync('science/sapix-import.js','utf8'),context);
          const fixture=[
            '2026年5月7日 実施',
            '理 科 64 / 100 54.9 2012 / 5913 55.0 1189 / 3266',
            '分野 得点/配点 平均点',
            '1 小問集合 35 / 35 27.9',
            '2 角度 18 / 30 17.8',
            '3 数列・規則性 18 / 23 13.4',
            '4 文章題 24 / 24 13.8',
            '5 規則性 6 / 18 5.5',
            '6 およその数 13 / 20 4.3',
            '1 漢字の読み書き 12 / 20 12.8',
            '2 知識総合 14 / 20 13.9',
            '3 説明文の読解 22 / 55 24.4',
            '4 物語文の読解 26 / 55 26.8',
            '1 小問集合 18 / 30 17.9',
            '2 ろうそくの燃焼 13 / 20 10.2',
            '3 気体の性質 16 / 20 13.8',
            '4 天体 17 / 30 13.2',
            '1 国土や気候に関する問題 39 / 55 28.5',
            '2 地形図や食べ物に関する問題 33 / 45 28.0'
          ].join(' ');
          const parsed=vm.runInContext('window.ScienceSapixImport.analyzeText('+JSON.stringify(fixture)+')',context);
          if(parsed.parseQuality.scienceTotal!==100 || parsed.sections.length!==4) throw new Error('science SAPIX PDF parser fixture failed');
          if(parsed.sections[1].topic!=='燃焼と気体' || parsed.sections[3].topic!=='星の動き') throw new Error('science SAPIX topic mapping failed');
          if(!parsed.summary || parsed.summary.score!==64 || parsed.summary.max!==100 || parsed.summary.dev!==54.9 || parsed.summary.average!==55.0) throw new Error('science SAPIX summary parse failed');
          if(parsed.date!=='2026-05-07') throw new Error('science SAPIX date parse failed');
          const htmlParsed=context.window.ScienceSapixImport.analyzeText('<html><body><div>'+fixture.replace(/ /g,'</span><span>')+'</div></body></html>');
          if(htmlParsed.parseQuality.scienceTotal!==100) throw new Error('science SAPIX HTML parse failed');
          const pools=vm.runInContext('WEEKLY_CANDIDATES.map(p=>[p.topic,topicQuestionPool(p.topic).filter(q=>q.grade<=4&&q.type==="choice").length])',context);
          if(pools.some(x=>x[1]<1)) throw new Error('science topic map has empty pool: '+JSON.stringify(pools));
          console.log('Science PWA integrity PASS: '+qs.length+' questions');
          NODE

      - name: Verify PWA structure and privacy
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f curriculum.js
          test -f all_problems.js
          test -f sw.js
          test -f manifest.webmanifest
          test -f robots.txt
          test -f assets/icon.svg
          test -f .nojekyll
          grep -q 'noindex,nofollow,noarchive,nosnippet' science/index.html || { echo "science privacy meta missing" >&2; exit 1; }
          if grep -R --exclude-dir=.git --exclude-dir=.github --exclude-dir=.parts --exclude-dir=.gzparts -n "隼" .; then
            echo "Public runtime contains a personal name" >&2
            exit 1
          fi

      - name: Remove transfer-only sources
        run: rm -rf .parts .gzparts

      - name: Setup and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
